name: daily refresh & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "45 20 * * *" # 20:45 UTC ≈ 6:45–7:45am Melbourne, every day
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Cron / manual runs refresh the data; plain pushes deploy as-is.
      - name: Refresh footy data & news
        if: github.event_name != 'push'
        run: python3 scripts/update.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "side-by-side-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "data unchanged, nothing to commit"
          else
            git commit -m "data: daily refresh [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
